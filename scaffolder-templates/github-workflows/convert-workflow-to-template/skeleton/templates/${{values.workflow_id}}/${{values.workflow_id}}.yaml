apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ${{values.workflow_id}}
  title: ${{values.title}}
  description: ${{values.description}}
  tags:
    - orchestrator
spec:
  owner: red-hat-developer-hub-authors
  system: red-hat-developer-hub
  type: service

  parameters:
    - title: Choose Target Entity
      properties:
        target_entity:
          title: Target Entity for the workflow run
          description: Select an entity from the catalog
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
    ${{values.parameters}}

  steps:
    - id: runWorkflow
      name: Run workflow
      action: orchestrator:workflow:run
      input:
        workflow_id: ${{values.workflow_id}}
        target_entity: "{% raw %}${{ parameters.target_entity }}{% endraw %}"
        parameters: "{% raw %}${{ parameters }}{% endraw %}"

  output:
    links:
      - title: Open workflow run
        url: "{% raw %}${{ steps.runWorkflow.output.instanceUrl }}{% endraw %}"
